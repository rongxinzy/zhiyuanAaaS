# Zhiyuan Admin Console on k3s: static bundle + built-in same-origin proxy
# (/aep -> AEP control service, /api -> de-portal). The web-chat entry shown
# inside the Console derives the portal origin from the request hostname
# (default :30190), so no per-cluster URL configuration is needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: de-admin-console
  namespace: digital-employees
  labels: {app: de-admin-console}
spec:
  replicas: 1
  selector:
    matchLabels: {app: de-admin-console}
  template:
    metadata:
      labels: {app: de-admin-console}
    spec:
      containers:
        - name: admin-console
          image: 172.18.5.251:8081/zhiyuan/de-admin-console:0.1.1
          env:
            - {name: ZHIYUAN_AEP_BASE_URL, value: "http://aep-control-service.aep-system.svc.cluster.local:8080"}
            - {name: ZHIYUAN_PORTAL_BASE_URL, value: "http://de-portal.digital-employees.svc.cluster.local:8090"}
          ports:
            - containerPort: 5173
          readinessProbe:
            httpGet: {path: /, port: 5173}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: de-admin-console
  namespace: digital-employees
spec:
  type: NodePort
  selector: {app: de-admin-console}
  ports:
    - port: 80
      targetPort: 5173
      nodePort: 30196
