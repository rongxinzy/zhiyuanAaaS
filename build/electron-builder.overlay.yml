extends: electron-builder.json

# Enterprise packages must be distinguishable from the public Zhiyuan build in
# Windows Explorer, the Start menu, the taskbar, and the installer filename.
productName: 知远企业版
executableName: 知远企业版

extraResources:
  - from: ${env.ZHIYUAN_ENTERPRISE_EXTENSION_BUNDLE}
    to: zhiyuan-enterprise/extension.cjs
  - from: ${env.ZHIYUAN_ENTERPRISE_RENDERER_DIRECTORY}
    to: zhiyuan-enterprise/ui
    filter:
      - '**/*'
      - '!**/*.map'
  - from: ${env.ZHIYUAN_ENTERPRISE_ADMIN_DIRECTORY}
    to: zhiyuan-enterprise/admin
    filter:
      - '**/*'
      - '!**/*.map'
  - from: ${env.ZHIYUAN_ENTERPRISE_NOTICE_FILE}
    to: zhiyuan-enterprise/THIRD_PARTY_NOTICES.md
  - from: ${env.ZHIYUAN_ENTERPRISE_CONFIG_FILE}
    to: zhiyuan-enterprise/config.json
