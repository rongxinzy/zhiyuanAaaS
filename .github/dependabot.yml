version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Runtime deps serve the Admin Console bundle; group to keep PR noise low.
    groups:
      runtime:
        patterns: ['*']
    ignore:
      # The AEP SDK is pinned to a release tarball; bumps are a deliberate
      # platform decision coordinated with the AEP release train.
      - dependency-name: '@aep/sdk-node'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
