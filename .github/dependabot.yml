version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Runtime deps only matter for the extension bundle; group to keep PR noise low.
    groups:
      runtime:
        patterns: ['*']
    ignore:
      # The AEP SDK is pinned to a release tarball by digest; bumps are a
      # deliberate platform decision (see build/build-manifest.json).
      - dependency-name: '@aep/sdk-node'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
