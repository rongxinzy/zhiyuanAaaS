name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@42213152a85ae7569bdb6bec7bcd74cd691bfe41
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@42213152a85ae7569bdb6bec7bcd74cd691bfe41
      - uses: github/codeql-action/analyze@42213152a85ae7569bdb6bec7bcd74cd691bfe41
