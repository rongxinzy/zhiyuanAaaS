name: DevOps gate tests

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: devops-gate-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          cache: pip
          cache-dependency-path: .github/requirements-devops.txt
      - name: Verify CI inventory and trusted workflow boundary
        run: |
          python3 -m pip install --disable-pip-version-check -r .github/requirements-devops.txt
          python3 .github/check-devops-config.py
          python3 .github/check-devops-config.test.py
      - name: Test gate decisions and event transitions
        run: node --test .github/devops-gate.test.cjs .github/ci-results.test.cjs .github/ci-orchestration.test.cjs
