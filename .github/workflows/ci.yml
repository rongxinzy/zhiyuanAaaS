name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # Coverage gate: enforces the project floor (lines ≥ 80%) and produces
      # the baseline the ratchet job compares against.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-head
          path: coverage/coverage-summary.json
          retention-days: 3
      - run: npm run verify:admin:e2e
      - run: npm run verify:electron-rc
      - run: npm run verify:sdk

  # Coverage ratchet: a PR may not lower the line coverage relative to main.
  # The floor alone (80%) would allow slow erosion from e.g. 85% to 80%.
  coverage-ratchet:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Measure the base commit (script may predate coverage)
        run: |
          if npm run | grep -q " test:coverage"; then
            npm run test:coverage
          else
            mkdir -p coverage
            echo '{"total":{"lines":{"pct":-1}}}' > coverage/coverage-summary.json
          fi
      - name: Compare with the PR head
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: coverage-head
      - name: Locate the head summary
        run: |
          if [ -f coverage-head/coverage-summary.json ]; then
            echo "SUMMARY=coverage-head/coverage-summary.json" >> "$GITHUB_ENV"
          elif [ -f coverage-head/coverage/coverage-summary.json ]; then
            echo "SUMMARY=coverage-head/coverage/coverage-summary.json" >> "$GITHUB_ENV"
          elif [ -f coverage-summary.json ]; then
            echo "SUMMARY=coverage-summary.json" >> "$GITHUB_ENV"
          else
            find . -name coverage-summary.json -not -path "./coverage/*" | head -5
            exit 1
          fi
      - run: |
          base=$(node -e "const s=require('./coverage/coverage-summary.json');console.log(s.total.lines.pct)")
          head=$(node -e "const s=require('./${SUMMARY}');console.log(s.total.lines.pct)")
          echo "base(main)=$base% head(PR)=$head%"
          if [ "$base" = "-1" ]; then
            echo "Base commit predates coverage tooling; the 80% floor applies."
            exit 0
          fi
          if awk "BEGIN{exit !($head < $base)}"; then
            echo "::error::Line coverage dropped from ${base}% on main to ${head}% in this PR."
            exit 1
          fi

      - name: Resolve immutable AEP input
        id: manifest
        shell: bash
        run: |
          node -e "const manifest = require('./build/build-manifest.json'); const commit = manifest.aepProtocol?.commit; if (!/^[0-9a-f]{40}$/.test(commit ?? '')) throw new Error('build-manifest.json must pin aepProtocol.commit to a full commit SHA'); process.stdout.write('aep_commit=' + commit + '\n')" >> "$GITHUB_OUTPUT"

      # The pinned AEP compose stack currently cannot pull its object-storage
      # image (minio/minio was withdrawn from Docker Hub on 2026-09-11 and
      # quay.io anonymous pulls now return 401 — see AEP issue #181 and their
      # own skip mitigation in AEP PR #182). Gate the real-service E2E steps
      # behind the ZHIYUAN_ENABLE_AEP_E2E repository variable so the rest of
      # the verify job keeps a trustworthy signal. Once the AEP pin advances
      # to a compose stack with a pullable image, set the variable to 'true'
      # to restore full coverage; no code change is needed.
      - name: Checkout AEP control plane for real-service E2E
        if: vars.ZHIYUAN_ENABLE_AEP_E2E == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rongxinzy/Agent-Enterprise-Protocol
          path: aep-protocol
          ref: ${{ steps.manifest.outputs.aep_commit }}
      - name: Start AEP control plane
        if: vars.ZHIYUAN_ENABLE_AEP_E2E == 'true'
        working-directory: aep-protocol
        shell: bash
        run: |
          npm ci
          for attempt in 1 2 3; do
            if npm run compose:up; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "compose:up attempt ${attempt} failed; transient registry auth errors are retried"
              npm run compose:down || true
              sleep 20
            fi
          done
          echo "compose:up failed after 3 attempts"
          exit 1
      - name: Wait for AEP control plane
        if: vars.ZHIYUAN_ENABLE_AEP_E2E == 'true'
        run: curl --fail --retry 60 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/healthz
      - name: Verify Agent control compatibility
        if: vars.ZHIYUAN_ENABLE_AEP_E2E == 'true'
        env:
          ZHIYUAN_AEP_BASE_URL: http://127.0.0.1:8080
          ZHIYUAN_AEP_DEPLOYMENT_ID: demo
          ZHIYUAN_AEP_ADMIN_PASSWORD: change-this-admin-password
        run: npm run verify:agent-control:e2e
      - name: Verify Admin Console lifecycle
        if: vars.ZHIYUAN_ENABLE_AEP_E2E == 'true'
        env:
          ZHIYUAN_AEP_BASE_URL: http://127.0.0.1:8080
          ZHIYUAN_AEP_DEPLOYMENT_ID: demo
          ZHIYUAN_AEP_ADMIN_USERNAME: admin
          ZHIYUAN_AEP_ADMIN_PASSWORD: change-this-admin-password
        run: npm run verify:admin:real-e2e
      - name: Stop AEP control plane
        if: always() && vars.ZHIYUAN_ENABLE_AEP_E2E == 'true'
        run: |
          if [ -f aep-protocol/package.json ]; then
            npm --prefix aep-protocol run compose:down
          fi
