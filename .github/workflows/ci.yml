name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run verify:admin:e2e
      - run: npm run verify:electron-rc
      - run: npm run verify:sdk

      - name: Resolve immutable AEP input
        id: manifest
        shell: bash
        run: |
          node -e "const manifest = require('./build/build-manifest.json'); const commit = manifest.aepProtocol?.commit; if (!/^[0-9a-f]{40}$/.test(commit ?? '')) throw new Error('build-manifest.json must pin aepProtocol.commit to a full commit SHA'); process.stdout.write('aep_commit=' + commit + '\n')" >> "$GITHUB_OUTPUT"

      - name: Checkout AEP control plane for real-service E2E
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: rongxinzy/Agent-Enterprise-Protocol
          path: aep-protocol
          ref: ${{ steps.manifest.outputs.aep_commit }}
      - name: Start AEP control plane
        working-directory: aep-protocol
        run: npm ci && npm run compose:up
      - name: Wait for AEP control plane
        run: curl --fail --retry 60 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/healthz
      - name: Verify Agent control compatibility
        env:
          ZHIYUAN_AEP_BASE_URL: http://127.0.0.1:8080
          ZHIYUAN_AEP_DEPLOYMENT_ID: demo
          ZHIYUAN_AEP_ADMIN_PASSWORD: change-this-admin-password
        run: npm run verify:agent-control:e2e
      - name: Verify Admin Console lifecycle
        env:
          ZHIYUAN_AEP_BASE_URL: http://127.0.0.1:8080
          ZHIYUAN_AEP_DEPLOYMENT_ID: demo
          ZHIYUAN_AEP_ADMIN_USERNAME: admin
          ZHIYUAN_AEP_ADMIN_PASSWORD: change-this-admin-password
        run: npm run verify:admin:real-e2e
      - name: Stop AEP control plane
        if: always()
        run: |
          if [ -f aep-protocol/package.json ]; then
            npm --prefix aep-protocol run compose:down
          fi
