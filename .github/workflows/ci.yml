name: CI validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      admin: ${{ steps.outputs.outputs.admin }}
      browserScripts: ${{ steps.outputs.outputs.browserScripts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            admin:
              - 'src/admin/**'
              - 'vite.admin.config.ts'
              - 'scripts/admin-**'
              - 'scripts/verify-admin-**'
              - 'scripts/serve-admin.mjs'
            browserScripts:
              - 'scripts/verify-admin-crud-browser.mjs'
              - 'scripts/admin-browser-fixture.mjs'
              - 'scripts/e2e-environment.mjs'
      - id: outputs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "admin=${{ steps.filter.outputs.admin }}" >> "$GITHUB_OUTPUT"
            echo "browserScripts=${{ steps.filter.outputs.browserScripts }}" >> "$GITHUB_OUTPUT"
          else
            echo "admin=true" >> "$GITHUB_OUTPUT"
            echo "browserScripts=true" >> "$GITHUB_OUTPUT"
          fi

  source-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/check-source-line-limits.mjs
      - run: node scripts/check-large-files.mjs

  dead-code:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run knip
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: pip
          cache-dependency-path: .github/requirements-devops.txt
      - run: |
          python3 -m pip install --disable-pip-version-check -r .github/requirements-devops.txt
          python3 -m vulture .github/check-devops-config.py .github/check-devops-config.test.py --min-confidence 80

  lint-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.vite
          key: vite-admin-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            vite-admin-
      - run: npm ci
      - run: npm run verify:admin

  browser-e2e:
    if: needs.changes.outputs.admin == 'true' || needs.changes.outputs.browserScripts == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Playwright admin CRUD E2E (one retry on flake)
        run: |
          for attempt in 1 2; do
            if npm run verify:admin:e2e; then exit 0; fi
            if [ "$attempt" -lt 2 ]; then echo "verify:admin:e2e attempt ${attempt} failed; retrying once"; fi
          done
          exit 1

  verify:
    name: verify
    needs: [source-lines, dead-code, lint-typecheck, test, build, browser-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate required PR checks
        env:
          LINES: ${{ needs.source-lines.result }}
          DEAD: ${{ needs.dead-code.result }}
          LINT: ${{ needs.lint-typecheck.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.browser-e2e.result }}
        run: |
          set -euo pipefail
          fail=0
          for name in LINES DEAD LINT TEST BUILD; do
            result="${!name}"
            if [ "$result" != "success" ]; then
              echo "::error::Job $name finished with $result"
              fail=1
            fi
          done
          if [ "$E2E" != "success" ] && [ "$E2E" != "skipped" ]; then
            echo "::error::browser-e2e finished with $E2E"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "Lint, typecheck, unit tests, build, dead-code, source line limits, and scoped browser E2E passed."

  ci-gate:
    name: ci-gate
    needs: [verify]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Required aggregate for branch protection
        if: needs.verify.result == 'success'
        run: echo "ci-gate passed (verify succeeded)."
      - name: Block merge when verify failed
        if: needs.verify.result != 'success'
        run: |
          echo "::error::verify finished with ${{ needs.verify.result }}"
          exit 1
